<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUDIO LOCKED 💀🔊</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* Enquanto o som não estiver ativo, bloqueia cliques na página */
    body.audio-locked {
      cursor: not-allowed;
      pointer-events: none;
    }

    body.audio-active {
      cursor: pointer;
      pointer-events: auto;
    }

    #bg-img {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    #unmute-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      transition: opacity 0.2s ease;
      pointer-events: auto;
    }

    #unmute-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #unmute-btn {
      font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
      font-size: clamp(1.5rem, 5vw, 3.5rem);
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      background: #ff0033;
      border: 4px solid #fff;
      padding: 18px 36px;
      border-radius: 14px;
      box-shadow: 0 0 35px rgba(255, 0, 51, 0.9);
      cursor: pointer;
      animation: pulse 0.7s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.07); }
    }
  </style>
</head>
<body class="audio-locked">
  <img
    id="bg-img"
    src="https://i1.sndcdn.com/artworks-xp21CZaxEmUDcDJU-G0Ug1w-t500x500.jpg"
    alt="Full screen meme"
    crossorigin="anonymous"
  />

  <!-- Mete aqui o link direto para o teu ficheiro .mp3 / .wav / .ogg -->
  <audio id="loud-audio" src="COLOCA_AQUI_O_LINK_DO_AUDIO.mp3" loop preload="auto"></audio>

  <div id="unmute-overlay">
    <button id="unmute-btn" type="button">🔊 ATIVA O SOM PARA CLICAR</button>
  </div>

  <script>
    const audio = document.getElementById('loud-audio');
    const overlay = document.getElementById('unmute-overlay');
    const btn = document.getElementById('unmute-btn');

    let audioCtx = null;
    let gainNode = null;
    let soundEnabled = false;

    function isAudioTrulyActive() {
      return (
        soundEnabled &&
        !audio.paused &&
        !audio.muted &&
        audio.volume > 0 &&
        audioCtx &&
        audioCtx.state === 'running'
      );
    }

    function syncInteractionLock() {
      if (isAudioTrulyActive()) {
        soundEnabled = true;
        document.body.classList.remove('audio-locked');
        document.body.classList.add('audio-active');
        overlay.classList.add('hidden');
      } else {
        document.body.classList.add('audio-locked');
        document.body.classList.remove('audio-active');
        overlay.classList.remove('hidden');
      }
    }

    async function activateLoudAudio() {
      audio.muted = false;
      audio.volume = 1.0;

      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        const source = audioCtx.createMediaElementSource(audio);
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 3.0; // Ajuste de ganho (3.0 = 3x mais alto)
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
      }

      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      try {
        await audio.play();
        soundEnabled = audioCtx.state === 'running' && !audio.paused && !audio.muted;
      } catch (err) {
        soundEnabled = false;
      }

      syncInteractionLock();
    }

    // Bloqueia qualquer clique ou interação enquanto o som não estiver ativo
    function blockIfSoundOff(event) {
      if (!isAudioTrulyActive()) {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();

        // Se o utilizador carregou no botão ou na página, tenta ativar o som
        if (event.type === 'click' || event.type === 'pointerdown') {
          activateLoudAudio();
        }
        return false;
      }
    }

    // Captura na fase de captura (true) para impedir qualquer clique antes de chegar ao destino
    ['click', 'pointerdown', 'mousedown', 'touchstart', 'dblclick', 'contextmenu'].forEach((evt) => {
      document.addEventListener(evt, blockIfSoundOff, { capture: true, passive: false });
    });

    // Mantém o estado sincronizado se o som pausar ou for mutado
    ['play', 'playing', 'pause', 'volumechange'].forEach((evt) => {
      audio.addEventListener(evt, () => {
        if (evt === 'pause' || audio.muted || audio.volume === 0) {
          soundEnabled = false;
        }
        syncInteractionLock();
      });
    });

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      activateLoudAudio();
    });

    window.addEventListener('DOMContentLoaded', () => {
      syncInteractionLock();
      activateLoudAudio();
    });
  </script>
</body>
</html>
