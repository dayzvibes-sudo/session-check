<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Continuar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #start-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 20px;
      text-align: center;
    }

    .sound-check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      color: #ddd;
      cursor: pointer;
    }

    #start-btn {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 500;
      color: #111;
      background: #f5f5f5;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
    }

    #start-btn:hover {
      background: #e5e5e5;
    }

    #audio-notice {
      min-height: 1.2em;
      max-width: 420px;
      font-size: 0.9rem;
      color: #f87171;
    }

    #full-image {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 5;
    }

    body.unlocked #start-screen {
      display: none;
    }

    body.unlocked #full-image {
      display: block;
    }
  </style>
</head>
<body>
  <div id="start-screen">
    <label class="sound-check">
      <input id="sound-confirm" type="checkbox" />
      <span>Confirmo que o som do dispositivo está ligado</span>
    </label>

    <button id="start-btn" type="button">Continuar</button>
    <p id="audio-notice"></p>
  </div>

  <img
    id="full-image"
    src="https://i1.sndcdn.com/artworks-xp21CZaxEmUDcDJU-G0Ug1w-t500x500.jpg"
    alt=""
  />

  <!-- Coloca o teu ficheiro com este nome na mesma pasta: audio.mp3 -->
  <audio id="player" src="audio.mp3" loop preload="auto" playsinline></audio>

  <script>
    const confirmBox = document.getElementById('sound-confirm');
    const btn = document.getElementById('start-btn');
    const notice = document.getElementById('audio-notice');
    const player = document.getElementById('player');

    let audioCtx = null;
    let gainNode = null;

    function enableBoost() {
      player.muted = false;
      player.volume = 1.0;

      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        const source = audioCtx.createMediaElementSource(player);
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 3.0; // Volume alto
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
      }
    }

    btn.addEventListener('click', async () => {
      if (!confirmBox.checked) {
        notice.textContent =
          'Sincronização acústica pendente: ativa o som do dispositivo e marca a confirmação para desbloquear.';
        return;
      }

      try {
        enableBoost();

        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        await player.play();

        if (player.paused || player.muted || player.volume === 0) {
          notice.textContent =
            'A saída de áudio continua bloqueada pelo navegador. Ativa o som e tenta novamente.';
          return;
        }

        notice.textContent = '';
        document.body.classList.add('unlocked');
      } catch (err) {
        notice.textContent =
          'Falha ao iniciar o fluxo de áudio. Verifica se o ficheiro audio.mp3 existe e se o som está ativo.';
      }
    });
  </script>
</body>
</html>
