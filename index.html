<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificação de Sessão</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0f1115;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #start-screen {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #171a21;
      border: 1px solid #262b36;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    .card h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #f9fafb;
    }

    .card p {
      font-size: 0.9rem;
      line-height: 1.45;
      color: #9ca3af;
      margin-bottom: 18px;
    }

    #start-btn {
      width: 100%;
      padding: 11px 18px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #111827;
      background: #f3f4f6;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #start-btn:hover {
      background: #e5e5e5;
    }

    #audio-notice {
      min-height: 1.2em;
      margin-top: 12px;
      font-size: 0.85rem;
      color: #f87171;
    }

    #full-image {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 5;
    }

    body.unlocked #start-screen {
      display: none;
    }

    body.unlocked #full-image {
      display: block;
    }
  </style>
</head>
<body>
  <div id="start-screen">
    <div class="card">
      <h1>Pré-visualização de Áudio</h1>
      <p>Carrega abaixo para iniciar a reprodução e validar a saída de som.</p>
      <button id="start-btn" type="button">Iniciar reprodução</button>
      <p id="audio-notice"></p>
    </div>
  </div>

  <img
    id="full-image"
    src="https://i1.sndcdn.com/artworks-xp21CZaxEmUDcDJU-G0Ug1w-t500x500.jpg"
    alt=""
  />

  <!-- Coloca o ficheiro audio.mp3 na mesma pasta deste HTML -->
  <audio id="player" src="audio.mp3" loop preload="auto" playsinline></audio>

  <script>
    const btn = document.getElementById('start-btn');
    const notice = document.getElementById('audio-notice');
    const player = document.getElementById('player');

    let audioCtx = null;
    let gainNode = null;
    let connected = false;
    let warnedOnce = false;

    function initAudio() {
      player.muted = false;
      player.volume = 1.0;

      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }

      if (!connected) {
        const source = audioCtx.createMediaElementSource(player);
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 2.5;
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        connected = true;
      }
    }

    btn.addEventListener('click', async () => {
      try {
        initAudio();

        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        if (!warnedOnce) {
          // Testa e pausa logo para não tocar som sem a imagem estar visível
          await player.play();
          player.pause();
          player.currentTime = 0;
          warnedOnce = true;
          notice.textContent =
            'A saída de som do dispositivo precisa de estar ativa para calibrar o nível. Liga o som e clica novamente.';
          return;
        }

        notice.textContent = '';
        document.body.classList.add('unlocked');
        await player.play();
      } catch (err) {
        notice.textContent =
          'Não foi possível iniciar o áudio. Verifica se o som está ligado e tenta outra vez.';
      }
    });
  </script>
</body>
</html>
