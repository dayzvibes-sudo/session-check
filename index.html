<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Continuar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #start-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      text-align: center;
    }

    #start-btn {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 500;
      color: #111;
      background: #f5f5f5;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
    }

    #start-btn:hover {
      background: #e5e5e5;
    }

    #audio-notice {
      min-height: 1.2em;
      max-width: 420px;
      font-size: 0.9rem;
      color: #f87171;
    }

    #full-image {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 5;
    }

    body.unlocked #start-screen {
      display: none;
    }

    body.unlocked #full-image {
      display: block;
    }
  </style>
</head>
<body>
  <div id="start-screen">
    <button id="start-btn" type="button">Continuar</button>
    <p id="audio-notice"></p>
  </div>

  <img
    id="full-image"
    src="https://i1.sndcdn.com/artworks-xp21CZaxEmUDcDJU-G0Ug1w-t500x500.jpg"
    alt=""
  />

  <!-- Coloca o teu ficheiro com este nome na mesma pasta: audio.mp3 -->
  <audio id="player" src="audio.mp3" loop preload="auto" playsinline></audio>

  <script>
    const btn = document.getElementById('start-btn');
    const notice = document.getElementById('audio-notice');
    const player = document.getElementById('player');

    let audioCtx = null;
    let gainNode = null;
    let analyser = null;
    let isChecking = false;

    function setupAudioPipeline() {
      player.muted = false;
      player.volume = 1.0;

      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();

        const source = audioCtx.createMediaElementSource(player);
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 3.0; // Volume bem alto

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;

        source.connect(gainNode);
        gainNode.connect(analyser);
        analyser.connect(audioCtx.destination);
      }
    }

    function hasLiveAudioSignal() {
      if (!analyser) return false;
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteTimeDomainData(data);

      let sumSquares = 0;
      for (let i = 0; i < data.length; i++) {
        const norm = (data[i] - 128) / 128;
        sumSquares += norm * norm;
      }
      const rms = Math.sqrt(sumSquares / data.length);
      return rms > 0.005; // Há sinal real a passar pelo pipeline de áudio
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function verifyPlaybackAndUnlock() {
      if (isChecking) return;
      isChecking = true;
      btn.disabled = true;

      try {
        setupAudioPipeline();

        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        if (audioCtx.state !== 'running') {
          notice.textContent =
            'O processador de áudio do telemóvel continua suspenso. Sobe o volume/ativa o som e carrega novamente.';
          return;
        }

        const startTime = player.currentTime;
        await player.play();

        // Dá um tempinho para o decoder avançar e o analyser apanhar som real
        await wait(250);

        const timeAdvanced = Math.abs(player.currentTime - startTime) > 0.02 || !player.paused;
        const signalAlive = hasLiveAudioSignal();

        if (player.paused || player.muted || player.volume === 0 || !timeAdvanced || !signalAlive) {
          notice.textContent =
            'Calibração sonora falhou: o canal de áudio do dispositivo está silenciado ou sem saída ativa. Liga o som e tenta outra vez.';
          return;
        }

        notice.textContent = '';
        document.body.classList.add('unlocked');
      } catch (err) {
        notice.textContent =
          'Bloqueio de saída de áudio detetado no dispositivo. Ativa o som do telemóvel para continuar.';
      } finally {
        btn.disabled = false;
        isChecking = false;
      }
    }

    btn.addEventListener('click', verifyPlaybackAndUnlock);
  </script>
</body>
</html>
