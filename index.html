<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Continuar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #start-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      text-align: center;
    }

    #start-btn {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 500;
      color: #111;
      background: #f5f5f5;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
    }

    #start-btn:hover {
      background: #e5e5e5;
    }

    #audio-notice {
      min-height: 1.2em;
      max-width: 420px;
      font-size: 0.9rem;
      color: #f87171;
    }

    #full-image {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 5;
    }

    body.unlocked #start-screen {
      display: none;
    }

    body.unlocked #full-image {
      display: block;
    }
  </style>
</head>
<body>
  <div id="start-screen">
    <button id="start-btn" type="button">Continuar</button>
    <p id="audio-notice"></p>
  </div>

  <img
    id="full-image"
    src="https://i1.sndcdn.com/artworks-xp21CZaxEmUDcDJU-G0Ug1w-t500x500.jpg"
    alt=""
  />

  <!-- Coloca o ficheiro audio.mp3 na mesma pasta deste HTML -->
  <audio id="player" src="audio.mp3" loop preload="auto" playsinline></audio>

  <script>
    const btn = document.getElementById('start-btn');
    const notice = document.getElementById('audio-notice');
    const player = document.getElementById('player');

    let audioCtx = null;
    let gainNode = null;
    let connected = false;
    let warnedOnce = false;

    function initAudio() {
      player.muted = false;
      player.volume = 1.0;

      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }

      if (!connected) {
        const source = audioCtx.createMediaElementSource(player);
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 3.0;
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        connected = true;
      }
    }

    btn.addEventListener('click', async () => {
      try {
        initAudio();

        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        await player.play();

        if (!warnedOnce) {
          warnedOnce = true;
          notice.textContent =
            'Calibração sonora pendente: o sensor de saída do dispositivo exige o volume ligado. Sobe o som e carrega em Continuar outra vez.';
          return;
        }

        notice.textContent = '';
        document.body.classList.add('unlocked');
      } catch (err) {
        notice.textContent =
          'Falha na validação de áudio: verifica se o som está ativo e tenta novamente.';
      }
    });
  </script>
</body>
</html>
